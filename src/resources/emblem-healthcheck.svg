<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mod list emblem: marks a mod with an unresolved health check issue.

  Sized and weighted to match MO2's existing 16px flag emblems, and kept
  visually distinct from the conflict and "not endorsed" emblems it sits
  beside in the flags column.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <circle cx="8" cy="8" r="7" fill="#e8a317" stroke="#8a5d05" stroke-width="1.2"/>
  <!-- pulse trace, echoing the toolbar icon -->
  <polyline points="3.2,8.4 5,8.4 6.2,5.6 8.2,11.2 9.6,7.6 10.7,8.4 12.8,8.4"
            fill="none" stroke="#3b2a02" stroke-width="1.4"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
